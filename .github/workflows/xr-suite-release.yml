name: XR Suite release profiles
on:
  workflow_dispatch:
  push:
    tags: ["xr-suite-v*"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test all module combinations
        run: python tools/test_xr_suite_package.py
      - name: Build both profiles from the same revision
        run: python tools/release_xr_suite.py --output-dir "${{ runner.temp }}/xr-suite-release"
      - uses: actions/upload-artifact@v4
        with:
          name: xr-suite-release
          path: ${{ runner.temp }}/xr-suite-release/
          if-no-files-found: error
